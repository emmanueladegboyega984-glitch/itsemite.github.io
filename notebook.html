<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        body{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: hsl(266, 78%, 23%);
            position: relative;
        }
        body .quote-container{
            border: 4px solid white;
            height: 400px;
            min-width: 100px;
            max-width: 400px;
            border-radius: 50%;
            color: white;
            display: flex;
            flex-direction: column;
            /* align-items: center; */
            justify-content: center;
            background-color: hsl(0, 59%, 51%);
        }

        body .quote-container .quote{
            font-size: 1.5rem;
            text-align: right;
            padding: 5px;
        }

        body .quote-container .author{
            text-align: right;
            padding: 5px;
        }

        .block_container{
            display: flex;
            justify-content: space-between;
            width: 80%;
            position: absolute;
            bottom: 20px;
        }

        .block1{
            width: 150px;
            height: 100px;
            background-color: red;
        }
        .block2{
            width: 200px;
            height: 100px;
            background-color: white;
        }
    </style>
</head>
<body>
    <div class="quote-container">
        <p class="quote">"Liberty, when it begins to take root is a plant of rapid growth."</p>
        <p class="author">George Washington</p>
    </div>
    <div class="block_container">
        <div class="block1"></div>
        <div class="block2"></div>
    </div>

    <script>
        const btn1 = document.querySelector(".block1")
        const btn2 = document.querySelector(".block2")

        const container = document.querySelector(".quote-container")

        btn1.addEventListener("click",()=>{
            container.style.background = "red";
        })

        btn2.addEventListener("click",()=>{
            container.style.background = "white";
            // container.style.color
        })
        container.addEventListener("click",()=>{
            container.style.background = "hsl(0, 59%, 51%)";
        })
    </script>
</body>
</html>
