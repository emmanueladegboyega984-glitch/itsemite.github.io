<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport
        content="width=devices-width,
        intial-scale=1.0">
        <title>Facebook UI Clone</title>
        <style>
            body {
                margin: 0;
                font-family: Arial, Helvetica, sans-serif;
                background-color: #f0f2f5;
            }
            .navbar {
                background: #8771f2;
                color:white ;
                display: flex;
                align-items: center;
                padding: 10px 20px;
                justify-content: space-between;
            }
             .logo {
                font-size: 24px;
                font-weight: bold;
             }
             .search input {
                padding: 6px;
                border-radius: 20px;
                border: none;
                width: 250px;
             }
             /* Layout */
             .container {
                display: flex;
                margin-top: 10px;
             }
             /* SIDEBARS */
             .sidebars {
                width: 25%;
                padding: 15px;
             }
             .rightbar {
                width: 25%;
                padding: 15px;
             }
             .feed {
                width: 25%;
                padding: 15px;

             }
             /* CARD */
             .card {
                background: white;
                padding: 15px;
                border-radius: 15px;
                margin-bottom: 15px;
                box-shadow: 0 2px 5px rgb(0,0,0,0.1);
             }
             .profile {
                display: flex;
                align-items: center;
             }
             .profile img {
                width: 40px;
                height: 40px;
                border-radius: 50%;
                margin-right: 10px;
             }
             /* POST IMAGE */
             .post img {
                width: 100%;
                border-radius: 10px;
                margin-top: 10px;
             }
             .action  {
                display: flex;
                justify-content: space-around;
                margin-top: 10px;
             }
             .action button {
                border: none;
                background: none;
                cursor: pointer;
                font-weight: bold;
             }
             </style>
    </head>
    <body>
        <!--NAVBAR-->
        <div class="navbar">
            <div class="logo">Facebook</div>
            <div class="search">
                <input type="text" placeholder="Search Facebook">
            </div>
        </div>
        <!--MAIN CONTAINER-->
        <div class="sidebar">
            <div class="card"> HOME</div>
            <div class="card"> Friends</div>
            <div class="card"> Watch</div>
            <div class="card"> Marketplace</div>
        </div>
        <!--FEED-->
        <div class="feed">
            <!--POST-->
            <div class="card"></div>
            <div class="profile">
                <img src="http://via.placeholder.com/40">
                <div>
                    <strong>John Doe</strong><br>
                    <small>2 hrs ago</small>
                    </div>
                    </div>
                    <p>THIS IS MY FIRST FACEBOOK CLONE POST</p>
                    <div class="post">
                        <img src="http://via.placeholder.com/500x300">
                        </div>
                    <div class="actions">
                        <button> like</button>
                        <button> Comment</button>
                        <button>Share</button>
                    </div>
                </div>
        </div>
        <!--RIGHT SIDEBAR-->
        <div class="rightbar">
        <div class="card">sponsored Ads</div>
        <div class="card">contacts</div>
        </div>
    </div>
    </body>
</html>
