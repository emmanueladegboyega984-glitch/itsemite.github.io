<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook</title>

    <style>
        * {
            padding: 0;
            box-sizing: border-box;
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            user-select: none;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: hsl(0, 0%, 90%);
        }

        .main-container {
            background-color: hsl(240, 100%, 60%);
            position: relative;
            height: 100px;
            width: 100px;
            border-radius: 50%;
            box-shadow: 2px 5px 10px hsl(0, 0%, 30%);
        }

        h1 {
            color: white;
            position: absolute;
            right: 50%;
            transform: translate(50%, 20%);
            bottom: 0;
            font-size: 5rem;
        }
    </style>

</head>

<body>
    <div class="main-container">
        <h1>f</h1>
    </div>
</body>

</html>
